<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-content">
      <span class="logo">&#9917; Scout Hub</span>
      <span class="subtitle">Football Scouting Manager</span>
    </div>
  </header>

  <main id="app"></main>

  <!-- Player Modal -->
  <div id="player-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Add Player</h2>
      <form id="player-form" novalidate>
        <div class="form-group">
          <label for="player-name">Name</label>
          <input type="text" id="player-name" placeholder="e.g. Mohamed Salah" maxlength="100">
          <span class="field-error" id="name-error"></span>
        </div>
        <div class="form-group">
          <label for="player-team">Team</label>
          <input type="text" id="player-team" placeholder="e.g. Liverpool FC" maxlength="100">
          <span class="field-error" id="team-error"></span>
        </div>
        <div class="form-group">
          <label for="player-position">Position</label>
          <select id="player-position">
            <option value="">Select position...</option>
            <option value="CB">CB — Center Back</option>
            <option value="FB">FB — Full Back</option>
            <option value="6ER">6er — Defensive Mid</option>
            <option value="8ER">8er — Box-to-Box Mid</option>
            <option value="WIDE">Wide Player</option>
            <option value="CF">CF — Center Forward</option>
          </select>
          <span class="field-error" id="position-error"></span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-player">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Player</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="report-modal" class="modal hidden" data-player-id="">
    <div class="modal-content">
      <h2>Add Match Report</h2>
      <form id="report-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="report-rating">Rating</label>
            <select id="report-rating">
              <option value="1">1 &#9733;</option>
              <option value="2">2 &#9733;&#9733;</option>
              <option value="3" selected>3 &#9733;&#9733;&#9733;</option>
              <option value="4">4 &#9733;&#9733;&#9733;&#9733;</option>
              <option value="5">5 &#9733;&#9733;&#9733;&#9733;&#9733;</option>
            </select>
          </div>
          <div class="form-group">
            <label for="report-cards">Cards</label>
            <select id="report-cards">
              <option value="None">None</option>
              <option value="Yellow">Yellow</option>
              <option value="Red">Red</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="report-minutes">Minutes Played</label>
            <input type="number" id="report-minutes" min="0" max="120" value="90">
            <span class="field-error" id="minutes-error"></span>
          </div>
          <div class="form-group">
            <label for="report-goals">Goals Scored</label>
            <input type="number" id="report-goals" min="0" value="0">
            <span class="field-error" id="goals-error"></span>
          </div>
        </div>
        <div class="form-group">
          <label for="report-comments">Comments</label>
          <textarea id="report-comments" rows="3" placeholder="Match observations..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-report">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Report</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content modal-small">
      <h2>Confirm Delete</h2>
      <p id="confirm-message">Are you sure you want to delete this?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-confirm">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-yes">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
